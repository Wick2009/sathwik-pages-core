<!-- Lesson Chat: collapsible WebSocket chat at the bottom of a lesson page. -->
<!-- Opt-in via `chat: true` in lesson frontmatter. -->
<!-- Talks to Spring through the Messages system's socket, requests and message shape -->
<!-- (assets/js/projects/messages/), like announcement_chat.html and /dm. Per-lesson -->
<!-- scope is achieved by tagging messages with a [[lesson:<url>]] marker and filtering -->
<!-- on the client. All lessons share a single group named "lessons". -->

<details id="lessonChat" data-lesson-key="{{ page.url }}" style="margin-top:2em">
  <summary>Lesson Chat — <span id="lessonChatStatus">click to open</span></summary>
  <div id="lessonChatMessages" aria-live="polite" style="height:18em;overflow-y:auto;border:1px solid;padding:.5em;margin:.5em 0">
    <p id="lessonChatEmpty"><em>No messages yet.</em></p>
  </div>
  <form id="lessonChatForm" class="chat-form chat-form--rich" autocomplete="off" style="display:flex;gap:.5em;align-items:stretch">
    <button id="lessonChatSend" class="chat-send" type="submit" disabled>Send</button>
  </form>
</details>

<script type="module">
  import { javaURI, javaWebSocketURI, pythonURI, fetchOptions } from '{{site.baseurl}}/assets/js/api/config.js';
  import { createRichComposer, renderRichMessage } from '{{site.baseurl}}/assets/js/chat/rich-text.js';
  import { createChatSocket } from '{{site.baseurl}}/assets/js/projects/messages/chat-socket.js';
  import { createMessagesApi } from '{{site.baseurl}}/assets/js/projects/messages/messages-api.js';
  import { classifyGroupEvent, groupMessage } from '{{site.baseurl}}/assets/js/projects/messages/messages-model.js';

  const LESSON_KEY = {{ page.url | jsonify }};
  const LESSON_MARKER = `[[lesson:${LESSON_KEY}]]`;
  const LESSON_MARKER_RE = /^\s*\[\[lesson:([^\]]+)\]\]\s?/;

  const api = createMessagesApi({ javaURI, pythonURI, fetchOptions });
  const socket = createChatSocket(javaWebSocketURI, {
    onClose: () => {
      setStatus('disconnected');
      composer.setEnabled(false);
      sendBtn.disabled = true;
    },
  });

  const state = {
    groupId: null,
    initialized: false,
    currentUserDisplayName: 'You',
    seenKeys: new Set(),
  };

  const detailsEl = document.getElementById('lessonChat');
  const statusEl = document.getElementById('lessonChatStatus');
  const messagesEl = document.getElementById('lessonChatMessages');
  const sendBtn = document.getElementById('lessonChatSend');
  const formEl = document.getElementById('lessonChatForm');

  const composer = createRichComposer({
    placeholder: 'Message this lesson…',
    maxLength: 2000,
    onSubmit: submitMessage,
  });
  formEl.insertBefore(composer.element, sendBtn);

  let sending = false;
  async function submitMessage() {
    if (sending || composer.isEmpty() || composer.isOverLimit()) return;
    sending = true;
    try {
      if (await sendMessage(composer.getHTML())) composer.clear();
    } finally {
      sending = false;
    }
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function formatTimestamp(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function clearEmpty() {
    const empty = document.getElementById('lessonChatEmpty');
    if (empty) empty.remove();
  }

  // A message in the Messages shape (messages-model.js), its lesson marker already off the body.
  function appendMessage({ senderKey, senderName, body, sentAt }) {
    clearEmpty();
    const who = senderKey === state.currentUserDisplayName ? 'You' : senderName;
    const when = formatTimestamp(sentAt);
    const line = document.createElement('p');
    const strong = document.createElement('strong');
    strong.textContent = who;
    const bodyEl = document.createElement('span');
    renderRichMessage(bodyEl, body);
    line.append(strong, document.createTextNode(when ? ` · ${when}: ` : ': '), bodyEl);
    messagesEl.appendChild(line);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendSystem(text) {
    clearEmpty();
    const el = document.createElement('p');
    const em = document.createElement('em');
    em.textContent = text;
    el.appendChild(em);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function matchesLesson(rawMessage) {
    const m = LESSON_MARKER_RE.exec(rawMessage || '');
    if (!m) return null;
    if (m[1] !== LESSON_KEY) return null;
    return (rawMessage || '').replace(LESSON_MARKER_RE, '');
  }

  // Every lesson posts to the same group, so only messages marked with this lesson show.
  function showIfThisLesson(message) {
    const body = matchesLesson(message.body);
    if (body === null || state.seenKeys.has(message.key)) return;
    state.seenKeys.add(message.key);
    appendMessage({ ...message, body });
  }

  async function resolveCurrentUser() {
    try {
      const res = await fetch(`${pythonURI}/api/id`, fetchOptions);
      if (!res.ok) {
        console.warn('Lesson chat: /api/id HTTP', res.status);
        return;
      }
      const user = await res.json();
      state.currentUserDisplayName = user?.name || user?.uid || user?.github || 'You';
    } catch (err) {
      console.warn('Lesson chat: user lookup failed', err);
    }
  }

  async function resolveGroup() {
    if (window.__lessonChatGroupId) {
      state.groupId = window.__lessonChatGroupId;
      return true;
    }
    let groups;
    try {
      groups = await api.searchGroups('lessons');
    } catch (err) {
      console.warn('Lesson chat: group lookup failed', err);
      return false;
    }
    const match = Array.isArray(groups)
      ? (groups.find((g) => (g?.name || '').toLowerCase() === 'lessons') || groups[0])
      : groups;
    const id = Number(match?.id);
    if (!id) {
      console.warn('Lesson chat: no group named "lessons" in response', groups);
      return false;
    }
    state.groupId = id;
    window.__lessonChatGroupId = id;
    return true;
  }

  async function loadHistory() {
    if (!state.groupId) return;
    try {
      const saved = await api.groupMessages(state.groupId);
      (saved || []).map(groupMessage).forEach(showIfThisLesson);
    } catch (err) {
      console.warn('Lesson chat: history load failed', err);
    }
  }

  function handleIncoming(event) {
    const change = classifyGroupEvent(event);
    if (change.type === 'message') showIfThisLesson(change.message);
  }

  async function connect() {
    setStatus('connecting…');
    if (!await socket.connect()) {
      setStatus('disconnected');
      return false;
    }
    socket.follow(`/topic/group/${state.groupId}`, handleIncoming);
    setStatus('connected');
    return true;
  }

  // Posted over HTTP, like the Messages page: Spring takes the sender from the
  // login cookie, which the socket's sendMessage can't read. The saved message
  // comes back to every reader, this one included, on the group topic.
  async function sendMessage(text) {
    if (!state.groupId) return false;
    try {
      await api.sendGroupMessage(state.groupId, `${LESSON_MARKER} ${text}`);
      return true;
    } catch (err) {
      console.warn('Lesson chat: send failed', err);
      return false;
    }
  }

  async function initOnce() {
    if (state.initialized) return;
    state.initialized = true;
    setStatus('loading…');
    await resolveCurrentUser();
    const ok = await resolveGroup();
    if (!ok) {
      console.warn('Lesson chat: the "lessons" group could not be resolved; see prior warnings for cause');
      setStatus('unavailable');
      appendSystem('Lesson chat is not available right now.');
      return;
    }
    await loadHistory();
    const connected = await connect();
    if (connected) {
      composer.setEnabled(true);
      sendBtn.disabled = false;
      composer.focus();
    }
  }

  detailsEl.addEventListener('toggle', () => {
    if (detailsEl.open) initOnce();
  });

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    submitMessage();
  });

  window.addEventListener('beforeunload', () => socket.disconnect());
</script>
